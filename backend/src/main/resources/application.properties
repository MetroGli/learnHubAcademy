spring.application.name=learnhub-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/learnhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:learnhub_user}
# Valor por defecto = contraseña del docker-compose.yml de desarrollo
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:learnhub_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# Server
server.port=8080

# JWT
# Sin JWT_SECRET se genera una clave aleatoria al arrancar (las sesiones se pierden al reiniciar)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Cookie del token solo por HTTPS (localhost también cuenta como seguro en el navegador)
jwt.cookie-secure=true
