spring.application.name=learnhub-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/learnhub
spring.datasource.username=learnhub_user
spring.datasource.password=learnhub_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=learnhub-development-secret-key-2026-this-must-be-long-enough
jwt.expiration=86400000